apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: checkout
  labels:
    app.kubernetes.io/part-of: tekton-migrate
spec:
  description: Clones a git repo into the source workspace. depth 0 does a full-history clone (required by jj sync).
    Emits the checked-out commit sha as result `commit`.
  params:
  - name: url
    type: string
  - name: revision
    type: string
    default: ''
  - name: depth
    type: string
    default: '1'
  results:
  - name: commit
    description: checked-out HEAD sha
  steps:
  - name: clone
    image: docker.io/library/debian:bookworm-slim
    workingDir: /workspace/source
    script: "#!/usr/bin/env bash\nset -euo pipefail\nif ! command -v git >/dev/null 2>&1; then\n  apt-get update\
      \ -qq && apt-get install -y -qq git ca-certificates >/dev/null\nfi\nURL=\"$(params.url)\"\nDEPTH=\"$(params.depth)\"\
      \nREV=\"$(params.revision)\"\n\n# the source workspace persists across runs on the per-repo PVC (subPath src)\
      \ -\n# wipe any stale checkout (previous repo/branch) so refs never go stale\nfind . -mindepth 1 -delete 2>/dev/null\
      \ || rm -rf ./* ./.git\n\n# private Forgejo repos need auth: use the git-creds secret via git credential helper\n\
      if [[ -f /git-creds/username && -f /git-creds/password ]]; then\n  GIT_USER=\"$(cat /git-creds/username)\"\
      \n  GIT_PASS=\"$(cat /git-creds/password)\"\n  GIT_HOST=\"$(printf '%s' \"$URL\" | sed -E 's#https?://([^/]+)/.*#\\\
      1#')\"\n  printf 'https://%s:%s@%s\\n' \"$GIT_USER\" \"$GIT_PASS\" \"$GIT_HOST\" > ~/.git-credentials\n  chmod\
      \ 600 ~/.git-credentials\n  git config --global credential.helper store\nfi\n\ngit init -q\ngit config advice.detachedHead\
      \ false\ngit config remote.origin.url \"$URL\"\ngit config remote.origin.fetch \"+refs/heads/*:refs/remotes/origin/*\"\
      \n\nif [[ \"$DEPTH\" == \"0\" ]]; then\n  echo \"full-history clone (depth 0)\"\n  git fetch --tags --prune\
      \ origin\nelse\n  echo \"shallow clone depth=$DEPTH\"\n  git fetch --depth=\"$DEPTH\" --tags origin\nfi\n\n\
      if [[ -n \"$REV\" && \"$REV\" != \"FETCH_HEAD\" ]]; then\n  git checkout -q \"$REV\"\nelse\n  git checkout\
      \ -q FETCH_HEAD\nfi\n\nCOMMIT=\"$(git rev-parse HEAD)\"\necho \"checked out ${COMMIT}\"\ngit log -1 --format='%h\
      \ %s'\nprintf '%s' \"$COMMIT\" | tee $(results.commit.path)"
    volumeMounts:
    - name: git-creds
      mountPath: /git-creds
    - name: source-host
      mountPath: /workspace/source
    - name: buildkit-cache-host
      mountPath: /workspace/buildkit-cache
  volumes:
  - name: git-creds
    secret:
      secretName: git-creds
      defaultMode: 384
  - name: source-host
    hostPath:
      path: /var/lib/tekton-build/ocgo-usage/source
      type: DirectoryOrCreate
  - name: buildkit-cache-host
    hostPath:
      path: /var/lib/tekton-build/ocgo-usage/buildkit-cache
      type: DirectoryOrCreate
