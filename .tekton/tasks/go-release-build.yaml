apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-release-build
  labels:
    app.kubernetes.io/part-of: tekton-migrate
spec:
  description: Cross-compiles bin/<prefix>_<tag>_{linux,win.exe,mac} for linux/amd64, windows/amd64 and darwin/arm64
    from ./binDir. runTest=true also runs `go test ./...` first (commandcode-usage only today).
  params:
  - name: buildPkg
    type: string
    default: .
    description: go package to build (./cmd/kubegen for kubegen)
  - name: binPrefix
    type: string
    description: binary name prefix (ccusage/kubegen/ocgo-usage)
  - name: tag
    type: string
    description: release tag (forge.ref_name equivalent)
  - name: runTest
    type: string
    default: 'false'
    description: true|false - run go test ./... before building (ccusage)
  - name: goVersion
    type: string
    default: '1.26'
    description: falls back to installing this version when toolchain workspace unpowned
  volumes:
  - name: go-build-cache
    emptyDir: {}
  - name: source-host
    hostPath:
      path: /var/lib/tekton-build/ocgo-usage/source
      type: DirectoryOrCreate
  - name: toolchain-host
    hostPath:
      path: /var/lib/tekton-build/ocgo-usage/toolchain
      type: DirectoryOrCreate
  results:
  - name: binaries
    description: newline separated built binary paths
  steps:
  - name: cross-compile
    image: docker.io/library/debian:bookworm-slim
    workingDir: /workspace/source
    env:
    - name: BUILD_PKG
      value: $(params.buildPkg)
    - name: BIN_PREFIX
      value: $(params.binPrefix)
    - name: TAG
      value: $(params.tag)
    - name: RUN_TEST
      value: $(params.runTest)
    - name: GO_VERSION
      value: $(params.goVersion)
    script: "#!/usr/bin/env bash\nset -euo pipefail\nif ! command -v curl >/dev/null 2>&1; then\n  apt-get update\
      \ -qq && apt-get install -y -qq curl ca-certificates >/dev/null\nfi\n\nif [[ -x \"/workspace/toolchain/go/bin/go\"\
      \ ]]; then\n  GOROOT=\"/workspace/toolchain/go\"\nelse\n  GOROOT=/usr/local/go\n  if ! command -v go >/dev/null\
      \ 2>&1 || ! /usr/local/go/bin/go version | grep -q \"$GO_VERSION\"; then\n    echo \"installing go ${GO_VERSION}\"\
      \n    curl -fsSL -o /tmp/go.tgz \"https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz\"\n    rm -rf \"$GOROOT\"\
      \n    tar -C /usr/local -xzf /tmp/go.tgz\n  fi\nfi\nexport PATH=\"$GOROOT/bin:$PATH\"\nexport GOCACHE=\"/workspace/source/.gocache-$(echo\
      \ \"$GOROOT\" | md5sum | cut -c1-8)\"\ngo version\n\nif [[ \"$RUN_TEST\" == \"true\" ]]; then\n  echo \"running\
      \ go test ./...\"\n  go test ./...\nfi\n\nmkdir -p bin\nTAG=\"$TAG\"\nGOOS=linux  GOARCH=amd64 go build -o\
      \ \"bin/${BIN_PREFIX}_${TAG}_linux\"  \"${BUILD_PKG}\"\nGOOS=windows GOARCH=amd64 go build -o \"bin/${BIN_PREFIX}_${TAG}_win.exe\"\
      \ \"${BUILD_PKG}\"\nGOOS=darwin  GOARCH=arm64 go build -o \"bin/${BIN_PREFIX}_${TAG}_mac\"    \"${BUILD_PKG}\"\
      \nls -la bin | tee /tmp/binlist\n# emit binaries (full paths relative to source) for the upload task\nfind\
      \ bin -maxdepth 1 -type f -printf '%p\\n' | tee $(results.binaries.path)"
    volumeMounts:
    - name: source-host
      mountPath: /workspace/source
    - name: toolchain-host
      mountPath: /workspace/toolchain
