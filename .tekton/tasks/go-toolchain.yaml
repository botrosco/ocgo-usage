apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-toolchain
  labels:
    app.kubernetes.io/part-of: tekton-migrate
spec:
  description: Installs Go <version> from go.dev/dl and prints go version. Type C uses 1.26.5 (default), Type B
    release builds use 1.26. When the `toolchain` workspace is bound, installs to <ws>/go so the Pipeline's other
    tasks reuse it (they source the same path); the workspace also records where the install lives for downstream
    tasks.
  params:
  - name: version
    type: string
    default: 1.26.5
  results:
  - name: version
  - name: goroot
    description: directory the go install landed in (downstream tasks source from here)
  - name: gobin
    description: go binary directory (or goroot/bin)
  steps:
  - name: install
    image: docker.io/library/debian:bookworm-slim
    env:
    - name: VERSION
      value: $(params.version)
    script: "#!/usr/bin/env bash\nset -euo pipefail\nif ! command -v curl >/dev/null 2>&1; then\n  apt-get update\
      \ -qq && apt-get install -y -qq curl ca-certificates >/dev/null\nfi\n\nif [[ -d \"/workspace/toolchain\" ]];\
      \ then\n  GOROOT=\"/workspace/toolchain/go\"\n  GOROOT_PARENT=\"/workspace/toolchain\"\nelse\n  GOROOT=/usr/local/go\n\
      \  GOROOT_PARENT=/usr/local\nfi\nexport PATH=\"$GOROOT/bin:$(command -v go >/dev/null 2>&1 && go env GOPATH\
      \ 2>/dev/null || echo /root/go)/bin:$PATH\"\nexport GOROOT\n\nif ! command -v go >/dev/null 2>&1 || ! go version\
      \ | grep -q \"$VERSION\"; then\n  echo \"downloading go ${VERSION}\"\n  curl -fsSL -o /tmp/go.tgz \"https://go.dev/dl/go${VERSION}.linux-amd64.tar.gz\"\
      \n  rm -rf \"$GOROOT\"\n  tar -C \"$GOROOT_PARENT\" -xzf /tmp/go.tgz\nfi\nexport PATH=\"$GOROOT/bin:$(go env\
      \ GOPATH)/bin:$PATH\"\ngo version\nprintf '%s' \"$VERSION\" | tee $(results.version.path)\nprintf '%s' \"\
      $GOROOT\" | tee $(results.goroot.path)\nprintf '%s' \"$GOROOT/bin\" | tee $(results.gobin.path)"
    volumeMounts:
    - name: toolchain-host
      mountPath: /workspace/toolchain
  volumes:
  - name: toolchain-host
    hostPath:
      path: /var/lib/tekton-build/ocgo-usage/toolchain
      type: DirectoryOrCreate
