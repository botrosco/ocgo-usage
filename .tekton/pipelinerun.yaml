apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-build
  annotations:
    pipelinesascode.tekton.dev/on-event: '[push]'
    pipelinesascode.tekton.dev/on-target-branch: '[refs/tags/*]'
    pipelinesascode.tekton.dev/task: '[https://git.rossd.net/rosco/k8s-manifests/raw/commit/6cb47caffd9d3ca55cf72276ce6a14ac1e96c9b1/components/tekton-catalog/tasks/checkout/task.yaml, https://git.rossd.net/rosco/k8s-manifests/raw/commit/6cb47caffd9d3ca55cf72276ce6a14ac1e96c9b1/components/tekton-catalog/tasks/go-toolchain/task.yaml, https://git.rossd.net/rosco/k8s-manifests/raw/commit/6cb47caffd9d3ca55cf72276ce6a14ac1e96c9b1/components/tekton-catalog/tasks/go-release-build/task.yaml, https://git.rossd.net/rosco/k8s-manifests/raw/commit/6cb47caffd9d3ca55cf72276ce6a14ac1e96c9b1/components/tekton-catalog/tasks/go-release-upload/task.yaml]'
    # shared catalog tasks live in k8s-manifests (components/tekton-catalog); pinned
    # to sha 3347748 (go version resolution fix). Bump the sha here when catalog changes.
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build
    podTemplate:
      hostAliases:
      - ip: 192.168.1.22
        hostnames:
        - git.rossd.net
  timeouts:
    pipeline: 2h0m0s
  params:
  - name: repo
    value: ocgo-usage
  - name: url
    value: https://git.rossd.net/rosco/ocgo-usage.git
  - name: tag
    value: '{{git_tag}}'
  - name: buildPkg
    value: .
  - name: binPrefix
    value: ocgo-usage
  - name: runTest
    value: 'false'
  pipelineRef:
    name: release-build
